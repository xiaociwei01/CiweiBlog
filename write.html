<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写新文章</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            padding: 24px 20px 60px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 20px; }
        label { display: block; font-weight: 500; margin: 16px 0 4px; }
        input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-family: inherit; }
        textarea { min-height: 300px; resize: vertical; }
        button { background: #1a1a2e; color: #fff; border: none; padding: 12px 30px; border-radius: 40px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 20px; }
        button:hover { background: #2d2d4a; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 12px; color: #888; }
        .back { display: inline-block; margin-top: 12px; color: #888; text-decoration: none; }
        .back:hover { color: #1a1a2e; }
        .token-input { background: #f5f5f5; border: 1px solid #eee; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: #555; width: 100%; }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #aaa;
            margin: 12px 0;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .upload-area:hover { border-color: #1a1a2e; }
        .upload-area input[type="file"] { display: none; }
        .upload-status { font-size: 13px; color: #888; margin-top: 6px; }
        .upload-status .success { color: #28a745; }
        .upload-status .error { color: #d14a4a; }
        .token-status { font-size: 13px; margin-top: 6px; }
        .token-status.success { color: #28a745; }
        .token-status.error { color: #d14a4a; }
        .token-status .forget-link { color: #888; cursor: pointer; text-decoration: underline; margin-left: 10px; }
        .token-status .forget-link:hover { color: #d14a4a; }

        .token-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .token-row input { flex: 1; min-width: 200px; }
        .token-row .token-status { margin: 0; }

        .time-hint {
            font-size: 14px;
            color: #888;
            background: #f5f6f8;
            padding: 8px 14px;
            border-radius: 8px;
            margin-top: 4px;
            border: 1px solid #eee;
        }
        .time-hint strong {
            color: #1a1a2e;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>✍️ 写新文章</h1>

    <label>标题</label>
    <input type="text" id="title" placeholder="文章标题">

    <label>📅 发布时间</label>
    <div class="time-hint" id="timeHint">
        ⏱️ 将自动记录为：<strong id="timeDisplay">加载中...</strong>
    </div>

    <label>标签（用逗号分隔）</label>
    <input type="text" id="tags" placeholder="日记, 生活">

    <label>正文（Markdown 格式）</label>
    <textarea id="body" placeholder="写点什么..."></textarea>

    <label>📎 上传图片或视频（自动插入正文）</label>
    <div class="upload-area" id="uploadArea">
        <div>点击选择文件 或 拖拽到这里</div>
        <div style="font-size:12px;color:#bbb;">支持 jpg, png, gif, webp, mp4, mov, webm</div>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    </div>
    <div id="uploadStatus" class="upload-status">等待上传...</div>

    <label>🔑 GitHub Token</label>
    <div class="token-row">
        <input type="password" class="token-input" id="tokenInput" placeholder="ghp_xxxxx（输入后自动保存）">
        <span id="tokenStatus" class="token-status"></span>
    </div>

    <button id="publish">🚀 发布文章</button>
    <div id="status" class="status"></div>
    <a href="index.html" class="back">← 返回博客首页</a>

    <script>
        const REPO = 'xiaociwei01/CiweiBlog';
        const STORAGE_KEY = 'ciwei_blog_token';

        function getCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return {
                dateStr: `${year}-${month}-${day}`,
                timeStr: `${hours}:${minutes}`,
                fullStr: `${year}-${month}-${day} ${hours}:${minutes}`,
                filenamePrefix: `${year}-${month}-${day}-${hours}${minutes}`
            };
        }

        function updateTimeDisplay() {
            const time = getCurrentTime();
            document.getElementById('timeDisplay').textContent = time.fullStr;
        }
        updateTimeDisplay();
        setInterval(updateTimeDisplay, 60000);

        let token = '';

        function loadSavedToken() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                token = saved;
                document.getElementById('tokenInput').value = saved;
                document.getElementById('tokenStatus').innerHTML = `
                    ✅ 已加载
                    <span class="forget-link" onclick="forgetToken()">忘记</span>
                `;
                document.getElementById('tokenStatus').className = 'token-status success';
                return true;
            }
            return false;
        }

        function saveToken(t) {
            if (t && t.startsWith('ghp_')) {
                localStorage.setItem(STORAGE_KEY, t);
                token = t;
                document.getElementById('tokenStatus').innerHTML = `
                    ✅ 已保存
                    <span class="forget-link" onclick="forgetToken()">忘记</span>
                `;
                document.getElementById('tokenStatus').className = 'token-status success';
                return true;
            } else if (!t) {
                forgetToken();
                return false;
            } else {
                document.getElementById('tokenStatus').textContent = '⚠️ 格式错误，应以 ghp_ 开头';
                document.getElementById('tokenStatus').className = 'token-status error';
                return false;
            }
        }

        function forgetToken() {
            localStorage.removeItem(STORAGE_KEY);
            token = '';
            document.getElementById('tokenInput').value = '';
            document.getElementById('tokenStatus').textContent = '已清除';
            document.getElementById('tokenStatus').className = 'token-status';
        }

        document.getElementById('tokenInput').addEventListener('input', function() {
            const val = this.value.trim();
            if (val) {
                saveToken(val);
            } else {
                forgetToken();
            }
        });

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#1a1a2e';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#ddd';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ddd';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFiles(e.target.files);
            }
        });

        async function handleFiles(files) {
            let currentToken = token || localStorage.getItem(STORAGE_KEY);
            if (!currentToken) {
                uploadStatus.innerHTML = '<span class="error">⚠️ 请先输入 GitHub Token</span>';
                document.getElementById('tokenInput').focus();
                return;
            }

            for (const file of files) {
                if (file.size > 100 * 1024 * 1024) {
                    uploadStatus.innerHTML = `<span class="error">❌ ${file.name} 超过 100MB，无法上传</span>`;
                    continue;
                }

                uploadStatus.innerHTML = `⏳ 上传 ${file.name} ...`;

                try {
                    const base64 = await readFileAsBase64(file);
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const ext = file.name.split('.').pop();
                    const baseName = file.name.replace(/\.[^.]+$/, '');
                    const safeName = baseName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '-');
                    const filename = `${year}/${month}/${safeName}-${Date.now()}.${ext}`;
                    const path = `images/${filename}`;

                    const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
                    const payload = {
                        message: `上传文件: ${file.name}`,
                        content: base64.split(',')[1],
                        branch: 'main'
                    };

                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${currentToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const rawUrl = `https://raw.githubusercontent.com/${REPO}/main/${path}`;
                        const isVideo = file.type.startsWith('video/');
                        const markdown = isVideo
                            ? `<video controls src="${rawUrl}" style="max-width:100%;border-radius:8px;"></video>`
                            : `![](${rawUrl})`;
                        const cursorPos = document.getElementById('body').selectionStart || document.getElementById('body').value.length;
                        const body = document.getElementById('body');
                        const before = body.value.substring(0, cursorPos);
                        const after = body.value.substring(cursorPos);
                        body.value = before + markdown + '\n\n' + after;
                        body.dispatchEvent(new Event('input'));

                        uploadStatus.innerHTML = `<span class="success">✅ ${file.name} 上传成功，已插入正文</span>`;
                    } else {
                        const err = await res.json();
                        uploadStatus.innerHTML = `<span class="error">❌ ${file.name} 上传失败：${err.message || '未知错误'}</span>`;
                    }
                } catch (err) {
                    uploadStatus.innerHTML = `<span class="error">❌ ${file.name} 上传失败：${err.message}</span>`;
                }
            }
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('publish').addEventListener('click', async function() {
            const title = document.getElementById('title').value.trim();
            const tags = document.getElementById('tags').value.trim();
            const body = document.getElementById('body').value.trim();

            let currentToken = token || localStorage.getItem(STORAGE_KEY);
            if (!currentToken) {
                document.getElementById('status').textContent = '⚠️ 请先输入 GitHub Token';
                document.getElementById('tokenInput').focus();
                return;
            }

            if (!title || !body) {
                document.getElementById('status').textContent = '⚠️ 标题和正文不能为空';
                return;
            }

            const time = getCurrentTime();
            const dateStr = time.dateStr;
            const timeStr = time.timeStr;
            const fullStr = time.fullStr;
            const filenamePrefix = time.filenamePrefix;

            const slug = title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '-');
            const filename = `${filenamePrefix}-${slug}.md`;

            const content = `---
title: ${title}
date: ${fullStr}
tags: ${tags}
---

${body}`;

            const url = `https://api.github.com/repos/${REPO}/contents/posts/${filename}`;

            try {
                let sha = '';
                try {
                    const checkRes = await fetch(url, {
                        headers: { 'Authorization': `token ${currentToken}` }
                    });
                    if (checkRes.ok) {
                        const data = await checkRes.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                const payload = {
                    message: `添加文章: ${title}`,
                    content: btoa(unescape(encodeURIComponent(content))),
                    branch: 'main'
                };
                if (sha) payload.sha = sha;

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('status').innerHTML = `✅ 发布成功！发布时间：${fullStr} <a href="index.html">点击返回首页查看</a>`;
                    document.getElementById('publish').disabled = true;
                } else {
                    const err = await res.json();
                    document.getElementById('status').textContent = '❌ 发布失败：' + (err.message || '未知错误');
                }
            } catch (err) {
                document.getElementById('status').textContent = '❌ 网络错误：' + err.message;
            }
        });

        loadSavedToken();
    </script>
</body>
</html>
