<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>博客后台 · 文章管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            color: #1a1a2e;
            padding: 20px 16px 60px;
            max-width: 720px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .nav-bar .nav-title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            text-align: center;
            color: #1a1a2e;
        }

        .nav-bar .nav-title .sub {
            font-size: 12px;
            font-weight: 400;
            color: #aaa;
            display: block;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .actions .btn {
            display: inline-block;
            background: #1a1a2e;
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .actions .btn:hover {
            background: #2d2d4a;
        }

        .actions .btn-outline {
            background: transparent;
            color: #1a1a2e;
            border: 1px solid #ddd;
        }

        .actions .btn-outline:hover {
            background: #f0f0f0;
        }

        .post-list {
            list-style: none;
            padding: 0;
        }

        .post-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: box-shadow 0.2s;
        }

        .post-item:hover {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .post-item .left {
            flex: 1;
            min-width: 0;
        }

        .post-item .left .title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            display: block;
            text-decoration: none;
        }

        .post-item .left .title:hover {
            text-decoration: underline;
        }

        .post-item .left .meta {
            font-size: 12px;
            color: #bbb;
            margin-top: 2px;
        }

        .post-item .right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            color: #d14a4a;
            background: #f5f5f5;
        }

        .delete-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #bbb;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #ccc;
            font-size: 14px;
        }

        .loading-state .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #eee;
            border-top: 3px solid #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .token-area {
            margin-top: 12px;
            display: none;
        }

        .token-area.show {
            display: block;
        }

        .token-area input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .token-status {
            font-size: 13px;
            margin-top: 6px;
        }

        .token-status.success {
            color: #28a745;
        }

        .token-status.error {
            color: #d14a4a;
        }

        .token-status .forget-link {
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 10px;
        }

        .token-status .forget-link:hover {
            color: #d14a4a;
        }

        @media (max-width: 480px) {
            .post-item {
                padding: 12px 14px;
                flex-wrap: wrap;
            }

            .post-item .right {
                margin-left: 0;
                margin-top: 6px;
                width: 100%;
                justify-content: flex-end;
            }

            .actions .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-title">
            📂 文章管理
            <span class="sub">后台 · 所有文章</span>
        </div>
    </nav>

    <div class="actions">
        <a href="write.html" class="btn">✍️ 写新文章</a>
        <button class="btn btn-outline" id="tokenToggleBtn">🔑 管理 Token</button>
    </div>

    <div class="token-area" id="tokenArea">
        <input type="password" id="tokenInput" placeholder="ghp_xxxxx（输入 GitHub Token）">
        <div id="tokenStatus" class="token-status"></div>
    </div>

    <div id="postList" class="post-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <script>
        const REPO = 'xiaociwei01/CiweiBlog';
        const POSTS_PATH = 'posts';
        const API_URL = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}`;
        const STORAGE_KEY = 'ciwei_blog_token';
        const DETAIL_PAGE = 'Xiangqingye.html';

        let token = '';

        // ===== Token 管理 =====
        function loadSavedToken() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                token = saved;
                document.getElementById('tokenInput').value = saved;
                document.getElementById('tokenStatus').innerHTML = `
                    ✅ 已加载
                    <span class="forget-link" onclick="forgetToken()">忘记</span>
                `;
                document.getElementById('tokenStatus').className = 'token-status success';
                return true;
            }
            return false;
        }

        function saveToken(t) {
            if (t && t.startsWith('ghp_')) {
                localStorage.setItem(STORAGE_KEY, t);
                token = t;
                document.getElementById('tokenStatus').innerHTML = `
                    ✅ 已保存
                    <span class="forget-link" onclick="forgetToken()">忘记</span>
                `;
                document.getElementById('tokenStatus').className = 'token-status success';
                return true;
            } else if (!t) {
                forgetToken();
                return false;
            } else {
                document.getElementById('tokenStatus').textContent = '⚠️ 格式错误，应以 ghp_ 开头';
                document.getElementById('tokenStatus').className = 'token-status error';
                return false;
            }
        }

        function forgetToken() {
            localStorage.removeItem(STORAGE_KEY);
            token = '';
            document.getElementById('tokenInput').value = '';
            document.getElementById('tokenStatus').textContent = '已清除';
            document.getElementById('tokenStatus').className = 'token-status';
        }

        document.getElementById('tokenInput').addEventListener('input', function() {
            const val = this.value.trim();
            if (val) {
                saveToken(val);
            } else {
                forgetToken();
            }
        });

        document.getElementById('tokenToggleBtn').addEventListener('click', function() {
            const area = document.getElementById('tokenArea');
            area.classList.toggle('show');
            if (area.classList.contains('show')) {
                document.getElementById('tokenInput').focus();
            }
        });

        // ===== 获取文章列表 =====
        async function fetchPosts() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('无法读取文章列表');
                const files = await res.json();
                const posts = files.filter(f => f.name.endsWith('.md'));

                if (posts.length === 0) {
                    document.getElementById('postList').innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📝</div>
                            <div class="text">还没有文章，写一篇吧 ✍️</div>
                        </div>
                    `;
                    return;
                }

                posts.sort((a, b) => b.name.localeCompare(a.name));

                let html = '';
                for (const post of posts) {
                    try {
                        const contentRes = await fetch(post.download_url);
                        const contentText = await contentRes.text();
                        const titleMatch = contentText.match(/title:\s*(.+)/);
                        const dateMatch = contentText.match(/date:\s*(.+)/);
                        const title = titleMatch ? titleMatch[1].trim() : post.name.replace('.md', '');
                        const date = dateMatch ? dateMatch[1].trim() : '未知日期';

                        html += `
                            <li class="post-item" data-filename="${post.name}" data-sha="${post.sha}">
                                <div class="left">
                                    <a href="${DETAIL_PAGE}?file=${encodeURIComponent(post.name)}" class="title" target="_blank">${title}</a>
                                    <div class="meta">${date}</div>
                                </div>
                                <div class="right">
                                    <button class="delete-btn" onclick="deletePost(this)" title="删除这篇文章">🗑️</button>
                                </div>
                            </li>
                        `;
                    } catch (e) {
                        continue;
                    }
                }
                document.getElementById('postList').innerHTML = `<ul class="post-list">${html}</ul>`;
            } catch (err) {
                document.getElementById('postList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <div class="text">加载失败：${err.message}</div>
                    </div>
                `;
            }
        }

        // ===== 删除文章 =====
        async function deletePost(btn) {
            const li = btn.closest('.post-item');
            const filename = li.dataset.filename;
            const sha = li.dataset.sha;

            if (!token) {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    token = saved;
                } else {
                    alert('⚠️ 请先输入 GitHub Token（点击 "管理 Token" 按钮）');
                    document.getElementById('tokenArea').classList.add('show');
                    document.getElementById('tokenInput').focus();
                    return;
                }
            }

            if (!confirm(`确定要删除「${filename}」吗？此操作不可撤销！`)) return;

            btn.disabled = true;
            btn.textContent = '⏳';

            try {
                const url = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}/${filename}`;
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `删除文章: ${filename}`,
                        sha: sha,
                        branch: 'main'
                    })
                });

                if (res.ok) {
                    li.style.opacity = '0.3';
                    li.style.transition = 'opacity 0.3s';
                    setTimeout(() => li.remove(), 300);
                    const statusMsg = document.createElement('div');
                    statusMsg.className = 'token-status success';
                    statusMsg.textContent = `✅ 已删除「${filename}」`;
                    document.getElementById('postList').prepend(statusMsg);
                    setTimeout(() => statusMsg.remove(), 3000);
                } else {
                    const err = await res.json();
                    alert(`❌ 删除失败：${err.message || '未知错误'}`);
                    btn.disabled = false;
                    btn.textContent = '🗑️';
                }
            } catch (err) {
                alert(`❌ 网络错误：${err.message}`);
                btn.disabled = false;
                btn.textContent = '🗑️';
            }
        }

        loadSavedToken();
        fetchPosts();
    </script>

</body>
</html>
