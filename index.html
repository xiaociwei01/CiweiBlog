<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刺猬的博客</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            padding: 24px 20px 60px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .sub { color: #888; font-size: 14px; margin-bottom: 32px; }
        .post-list { list-style: none; padding: 0; }
        .post-item {
            padding: 16px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-item .left { flex: 1; }
        .post-item .left a { text-decoration: none; color: #1a1a2e; display: block; }
        .post-item .title { font-size: 20px; font-weight: 600; }
        .post-item .meta { font-size: 13px; color: #999; margin-top: 4px; }
        .post-item .tags { display: inline-block; background: #f0f0f0; padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #666; margin-right: 6px; }

        .post-item .right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: 12px; }
        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .delete-btn:hover { color: #d14a4a; background: #f5f5f5; }
        .delete-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .empty { color: #aaa; text-align: center; padding: 60px 0; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .write-btn, .token-toggle-btn {
            display: inline-block;
            background: #1a1a2e;
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .write-btn:hover, .token-toggle-btn:hover { background: #2d2d4a; }
        .token-toggle-btn { background: #555; font-size: 13px; padding: 8px 18px; }
        .token-toggle-btn:hover { background: #777; }
        .token-area { margin-top: 12px; display: none; }
        .token-area.show { display: block; }
        .token-area input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .token-status { font-size: 13px; margin-top: 6px; }
        .token-status.success { color: #28a745; }
        .token-status.error { color: #d14a4a; }
        .token-status .forget-link { color: #888; cursor: pointer; text-decoration: underline; margin-left: 10px; }
        .token-status .forget-link:hover { color: #d14a4a; }
    </style>
</head>
<body>
    <h1>📝 刺猬的博客</h1>
    <div class="sub">记录生活 · 分享想法</div>

    <div id="post-list" class="post-list">
        <div class="empty">加载中...</div>
    </div>

    <div class="actions">
        <a href="write.html" class="write-btn">✍️ 写新文章</a>
        <button class="token-toggle-btn" id="tokenToggleBtn">🔑 管理 Token</button>
    </div>

    <div class="token-area" id="tokenArea">
        <input type="password" id="tokenInput" placeholder="ghp_xxxxx（输入你的 GitHub Token）">
        <div id="tokenStatus" class="token-status"></div>
    </div>

    <script>
        const REPO = 'xiaociwei01/CiweiBlog';
        const POSTS_PATH = 'posts';
        const API_URL = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}`;
        const STORAGE_KEY = 'ciwei_blog_token';

        let token = '';

        // ===== 加载保存的 Token =====
        function loadSavedToken() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                token = saved;
                document.getElementById('tokenInput').value = saved;
                document.getElementById('tokenStatus').innerHTML = `
                    ✅ Token 已加载（存储在本地）
                    <span class="forget-link" onclick="forgetToken()">忘记</span>
                `;
                document.getElementById('tokenStatus').className = 'token-status success';
                return true;
            }
            return false;
        }

        // ===== 保存 Token =====
        function saveToken(t) {
            if (t && t.startsWith('ghp_')) {
                localStorage.setItem(STORAGE_KEY, t);
                token = t;
                document.getElementById('tokenStatus').innerHTML = `
                    ✅ Token 已保存（存储在本地）
                    <span class="forget-link" onclick="forgetToken()">忘记</span>
                `;
                document.getElementById('tokenStatus').className = 'token-status success';
                return true;
            } else if (!t) {
                forgetToken();
                return false;
            } else {
                document.getElementById('tokenStatus').textContent = '⚠️ Token 格式不正确，应以 ghp_ 开头';
                document.getElementById('tokenStatus').className = 'token-status error';
                return false;
            }
        }

        // ===== 忘记 Token（清除存储） =====
        function forgetToken() {
            localStorage.removeItem(STORAGE_KEY);
            token = '';
            document.getElementById('tokenInput').value = '';
            document.getElementById('tokenStatus').textContent = 'Token 已清除';
            document.getElementById('tokenStatus').className = 'token-status';
            document.getElementById('tokenArea').classList.remove('show');
        }

        // ===== Token 输入事件 =====
        document.getElementById('tokenInput').addEventListener('input', function() {
            const val = this.value.trim();
            if (val) {
                saveToken(val);
            } else {
                forgetToken();
            }
        });

        // ===== 显示/隐藏 Token 面板 =====
        document.getElementById('tokenToggleBtn').addEventListener('click', function() {
            const area = document.getElementById('tokenArea');
            area.classList.toggle('show');
            if (area.classList.contains('show')) {
                document.getElementById('tokenInput').focus();
            }
        });

        // ===== 获取文章列表 =====
        async function fetchPosts() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('无法读取文章列表');
                const files = await res.json();
                const posts = files.filter(f => f.name.endsWith('.md'));

                if (posts.length === 0) {
                    document.getElementById('post-list').innerHTML = '<div class="empty">还没有文章，写一篇吧 ✍️</div>';
                    return;
                }

                posts.sort((a, b) => b.name.localeCompare(a.name));

                let html = '';
                for (const post of posts) {
                    const name = post.name.replace('.md', '');
                    const contentRes = await fetch(post.download_url);
                    const contentText = await contentRes.text();
                    const titleMatch = contentText.match(/title:\s*(.+)/);
                    const dateMatch = contentText.match(/date:\s*(.+)/);
                    const tagsMatch = contentText.match(/tags:\s*(.+)/);
                    const title = titleMatch ? titleMatch[1].trim() : name;
                    const date = dateMatch ? dateMatch[1].trim() : '未知日期';
                    const tags = tagsMatch ? tagsMatch[1].split(',').map(t => t.trim()) : [];

                    html += `
                        <li class="post-item" data-filename="${post.name}" data-sha="${post.sha}">
                            <div class="left">
                                <a href="post.html?file=${encodeURIComponent(post.name)}">
                                    <div class="title">${title}</div>
                                    <div class="meta">
                                        ${date}
                                        ${tags.map(t => `<span class="tags">#${t}</span>`).join('')}
                                    </div>
                                </a>
                            </div>
                            <div class="right">
                                <button class="delete-btn" onclick="deletePost(this)" title="删除这篇文章">🗑️</button>
                            </div>
                        </li>
                    `;
                }
                document.getElementById('post-list').innerHTML = html;
            } catch (err) {
                document.getElementById('post-list').innerHTML = `<div class="empty">加载失败：${err.message}</div>`;
            }
        }

        // ===== 删除文章 =====
        async function deletePost(btn) {
            const li = btn.closest('.post-item');
            const filename = li.dataset.filename;
            const sha = li.dataset.sha;

            // 检查 Token（先从 localStorage 读取）
            if (!token) {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    token = saved;
                } else {
                    alert('⚠️ 请先输入 GitHub Token（点击页面上的 "管理 Token" 按钮）');
                    document.getElementById('tokenArea').classList.add('show');
                    document.getElementById('tokenInput').focus();
                    return;
                }
            }

            if (!confirm(`确定要删除「${filename}」吗？此操作不可撤销！`)) return;

            btn.disabled = true;
            btn.textContent = '⏳';

            try {
                const url = `https://api.github.com/repos/${REPO}/contents/${POSTS_PATH}/${filename}`;
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `删除文章: ${filename}`,
                        sha: sha,
                        branch: 'main'
                    })
                });

                if (res.ok) {
                    li.style.opacity = '0.3';
                    li.style.transition = 'opacity 0.3s';
                    setTimeout(() => li.remove(), 300);
                    const statusMsg = document.createElement('div');
                    statusMsg.className = 'token-status success';
                    statusMsg.textContent = `✅ 已删除「${filename}」`;
                    document.getElementById('post-list').prepend(statusMsg);
                    setTimeout(() => statusMsg.remove(), 3000);
                } else {
                    const err = await res.json();
                    alert(`❌ 删除失败：${err.message || '未知错误'}`);
                    btn.disabled = false;
                    btn.textContent = '🗑️';
                }
            } catch (err) {
                alert(`❌ 网络错误：${err.message}`);
                btn.disabled = false;
                btn.textContent = '🗑️';
            }
        }

        // ===== 初始化 =====
        loadSavedToken();
        fetchPosts();
    </script>
</body>
</html>
