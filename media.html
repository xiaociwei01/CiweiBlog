<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>媒体管理 · 后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 20px 16px 60px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 820px; width: 100%; }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 16px;
            border-bottom: 1px solid #e8ecf0;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-left .logo { font-size: 22px; font-weight: 700; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-outline { background: #fff; color: #1a1a2e; border: 1px solid #d0d5dd; }
        .btn-outline:hover { background: #f5f6f8; }
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .media-item {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e8ecf0;
            position: relative;
            transition: box-shadow 0.2s;
        }
        .media-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .media-item img, .media-item video {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            background: #f0f2f5;
        }
        .media-item .info {
            padding: 8px 10px;
            font-size: 12px;
            color: #888;
            word-break: break-all;
        }
        .media-item .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #dc2626;
            transition: all 0.2s;
        }
        .media-item .delete-btn:hover { background: #dc2626; color: #fff; }
        .loading-state, .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e8ecf0;
            color: #888;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #eee;
            border-top: 3px solid #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .token-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .token-modal.active { display: flex; }
        .token-modal .modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
        }
        .token-modal input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.35s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: #dc2626; }
    </style>
</head>
<body>
<div class="container">
    <nav class="nav-bar">
        <div class="nav-left">
            <span class="logo">🖼️ 媒体管理</span>
        </div>
        <button class="btn btn-outline" onclick="loadMedia()">🔄 刷新</button>
    </nav>
    <div id="mediaList" class="media-grid">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div class="token-modal" id="tokenModal">
    <div class="modal-box">
        <h3>🔑 输入 GitHub Token</h3>
        <p style="font-size:13px;color:#888;margin-bottom:12px;">用于删除媒体文件</p>
        <input type="password" id="tokenInput" placeholder="ghp_...">
        <button class="btn btn-primary" onclick="saveToken()">保存</button>
    </div>
</div>

<script>
    const REPO = 'xiaociwei01/CiweiBlog';
    const IMAGES_PATH = 'images';
    const STORAGE_KEY = 'ciwei_blog_token';

    let token = localStorage.getItem(STORAGE_KEY) || '';

    function showToast(msg, type='success') {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast ' + type;
        void toast.offsetWidth;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function saveToken() {
        const val = document.getElementById('tokenInput').value.trim();
        if (val && val.startsWith('ghp_')) {
            localStorage.setItem(STORAGE_KEY, val);
            token = val;
            document.getElementById('tokenModal').classList.remove('active');
            showToast('✅ Token 已保存');
            loadMedia();
        } else {
            showToast('⚠️ Token 格式错误', 'error');
        }
    }

    async function fetchAllMedia() {
        const headers = token ? { 'Authorization': `token ${token}` } : {};
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${IMAGES_PATH}`, { headers });
        if (!res.ok) throw new Error('无法读取 images 目录');
        const years = await res.json();
        const allFiles = [];

        for (const yearDir of years) {
            if (yearDir.type !== 'dir') continue;
            const yearRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${yearDir.path}`, { headers });
            if (!yearRes.ok) continue;
            const months = await yearRes.json();
            for (const monthDir of months) {
                if (monthDir.type !== 'dir') continue;
                const monthRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${monthDir.path}`, { headers });
                if (!monthRes.ok) continue;
                const files = await monthRes.json();
                for (const file of files) {
                    if (file.type === 'file') {
                        allFiles.push({
                            name: file.name,
                            path: file.path,
                            sha: file.sha,
                            download_url: file.download_url,
                            type: file.name.match(/\.(mp4|mov|webm)$/i) ? 'video' : 'image'
                        });
                    }
                }
            }
        }
        return allFiles;
    }

    function renderMedia(files) {
        const container = document.getElementById('mediaList');
        if (files.length === 0) {
            container.innerHTML = `<div class="empty-state">📭 没有媒体文件</div>`;
            return;
        }
        let html = '';
        for (const file of files) {
            const mediaTag = file.type === 'video'
                ? `<video src="${file.download_url}" preload="metadata" muted></video>`
                : `<img src="${file.download_url}" loading="lazy">`;
            html += `
                <div class="media-item" data-path="${file.path}" data-sha="${file.sha}">
                    ${mediaTag}
                    <button class="delete-btn" onclick="deleteMedia(this)" title="删除">🗑️</button>
                    <div class="info">${file.name}</div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    async function loadMedia() {
        const container = document.getElementById('mediaList');
        container.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>`;
        try {
            const files = await fetchAllMedia();
            renderMedia(files);
        } catch (err) {
            container.innerHTML = `<div class="empty-state">⚠️ 加载失败：${err.message}</div>`;
            showToast('❌ 加载失败', 'error');
        }
    }

    async function deleteMedia(btn) {
        const item = btn.closest('.media-item');
        const path = item.dataset.path;
        const sha = item.dataset.sha;
        if (!token) {
            document.getElementById('tokenModal').classList.add('active');
            return;
        }
        if (!confirm(`确定删除 ${path} 吗？`)) return;
        btn.disabled = true;
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `删除媒体: ${path}`,
                    sha: sha,
                    branch: 'main'
                })
            });
            if (res.ok) {
                item.remove();
                showToast('✅ 已删除');
            } else {
                const err = await res.json();
                showToast(`❌ 删除失败：${err.message}`, 'error');
                btn.disabled = false;
            }
        } catch (err) {
            showToast(`❌ 网络错误：${err.message}`, 'error');
            btn.disabled = false;
        }
    }

    // 初始化
    if (!token) {
        document.getElementById('tokenModal').classList.add('active');
    } else {
        loadMedia();
    }
</script>
</body>
</html>
