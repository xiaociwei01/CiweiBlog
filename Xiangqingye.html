<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>文章详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            color: #1a1a2e;
            padding: 20px 16px 60px;
            max-width: 720px;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .nav-bar .nav-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .nav-bar .nav-title .sub {
            font-size: 12px;
            font-weight: 400;
            color: #aaa;
            display: block;
            margin-top: 2px;
        }

        .detail-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 20px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f0;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .detail-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #e0e5ed;
        }

        .detail-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .detail-header .info {
            flex: 1;
            min-width: 0;
        }

        .detail-header .info .name {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .detail-header .info .time {
            font-size: 12px;
            color: #bbb;
            margin-top: 1px;
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .detail-body {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 14px;
        }

        .detail-body:empty {
            display: none;
        }

        .detail-images {
            display: grid;
            gap: 4px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f6fa;
            margin-top: 6px;
        }

        .detail-images.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .detail-images.single img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
            background: #f0f2f5;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .detail-images.single img:hover {
            transform: scale(1.01);
        }

        .detail-images.multi {
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .detail-images.multi.three {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
        }

        .detail-images.multi.three img:first-child {
            grid-column: 1 / -1;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }

        .detail-images.multi.three img:nth-child(2),
        .detail-images.multi.three img:nth-child(3) {
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .detail-images.multi img {
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #f0f2f5;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 4px;
            width: 100%;
            height: 100%;
        }

        .detail-images.multi img:hover {
            transform: scale(1.02);
        }

        .detail-videos {
            display: grid;
            gap: 4px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-top: 6px;
        }

        .detail-videos.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .detail-videos.single video {
            width: 100%;
            max-height: 500px;
            display: block;
            outline: none;
            border-radius: 12px;
            background: #000;
        }

        .detail-videos.multi {
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .detail-videos.multi.three {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
        }

        .detail-videos.multi.three video:first-child {
            grid-column: 1 / -1;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }

        .detail-videos.multi.three video:nth-child(2),
        .detail-videos.multi.three video:nth-child(3) {
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .detail-videos.multi video {
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #000;
            outline: none;
            border-radius: 4px;
            width: 100%;
            height: 100%;
        }

        .detail-tags {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .detail-tags .tag {
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #888;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
        }

        .loading-state .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #eee;
            border-top: 3px solid #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #d14a4a;
        }

        .error-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
        }

        .img-modal.active {
            display: flex;
        }

        .img-modal img {
            max-width: 95%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .detail-container {
                padding: 16px 14px 18px;
            }

            .detail-header .avatar {
                width: 38px;
                height: 38px;
            }

            .detail-title {
                font-size: 19px;
            }

            .detail-body {
                font-size: 15px;
            }

            .detail-images.single img {
                max-height: 280px;
            }

            .detail-videos.single video {
                max-height: 280px;
            }

            .detail-images.multi {
                gap: 3px;
            }

            .detail-videos.multi {
                gap: 3px;
            }

            .nav-bar .nav-title {
                font-size: 16px;
            }
        }

        @media (min-width: 641px) {
            .detail-images.single img {
                max-height: 500px;
            }

            .detail-videos.single video {
                max-height: 500px;
            }

            .detail-images.multi {
                gap: 6px;
            }

            .detail-videos.multi {
                gap: 6px;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 24px 32px 60px;
                max-width: 820px;
            }
        }

        @media (min-width: 1024px) {
            body {
                max-width: 900px;
                padding: 32px 40px 60px;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-title">
            📄 文章详情
            <span class="sub" id="detailSub">加载中...</span>
        </div>
    </nav>

    <div id="detailContent" class="detail-container">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图">
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        const BLOG_REPO = 'xiaociwei01/CiweiBlog';
        const AVATAR_URL = 'https://xiaociwei01.github.io/CiweiHome/ciweitouxiang.jpg';
        const NICKNAME = '小刺猬';

        function buildRawUrl(path) {
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path;
            }
            const clean = path.replace(/^\.?\//, '');
            return `https://raw.githubusercontent.com/${BLOG_REPO}/main/${clean}`;
        }

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function renderImages(images) {
            if (!images || images.length === 0) return '';

            const rawImages = images.map(img => buildRawUrl(img));

            if (images.length === 1) {
                return `
                    <div class="detail-images single">
                        <img src="${rawImages[0]}" alt="图片" onclick="openImgModal(this.src)" loading="lazy">
                    </div>
                `;
            }

            const threeClass = images.length === 3 ? 'three' : '';
            const imgsHtml = rawImages.map(src =>
                `<img src="${src}" alt="图片" onclick="openImgModal(this.src)" loading="lazy">`
            ).join('');

            return `
                <div class="detail-images multi ${threeClass}">
                    ${imgsHtml}
                </div>
            `;
        }

        function renderVideos(videos) {
            if (!videos || videos.length === 0) return '';

            const rawVideos = videos.map(v => buildRawUrl(v));

            if (videos.length === 1) {
                return `
                    <div class="detail-videos single">
                        <video controls src="${rawVideos[0]}" preload="metadata"></video>
                    </div>
                `;
            }

            const threeClass = videos.length === 3 ? 'three' : '';
            const vidsHtml = rawVideos.map(src =>
                `<video controls src="${src}" preload="metadata"></video>`
            ).join('');

            return `
                <div class="detail-videos multi ${threeClass}">
                    ${vidsHtml}
                </div>
            `;
        }

        async function loadPost() {
            const container = document.getElementById('detailContent');
            const sub = document.getElementById('detailSub');

            const filename = getUrlParam('file');
            if (!filename) {
                container.innerHTML = `
                    <div class="error-state">
                        <div class="icon">⚠️</div>
                        <div>没有指定文章</div>
                    </div>
                `;
                sub.textContent = '加载失败';
                return;
            }

            try {
                const rawUrl = `https://raw.githubusercontent.com/${BLOG_REPO}/main/posts/${filename}`;
                const res = await fetch(rawUrl);
                if (!res.ok) throw new Error('文章不存在或无法读取');

                const contentText = await res.text();

                const lines = contentText.split('\n');
                let title = filename.replace('.md', '');
                let date = '未知日期';
                let tags = '';
                let bodyStart = 0;

                if (lines[0] === '---') {
                    let end = lines.indexOf('---', 1);
                    if (end !== -1) {
                        const front = lines.slice(1, end);
                        front.forEach(line => {
                            if (line.startsWith('title:')) title = line.replace('title:', '').trim();
                            if (line.startsWith('date:')) date = line.replace('date:', '').trim();
                            if (line.startsWith('tags:')) tags = line.replace('tags:', '').trim();
                        });
                        bodyStart = end + 1;
                    }
                }

                const body = lines.slice(bodyStart).join('\n').trim();

                const images = [];
                const imgRegex = /!\[.*?\]\((.*?)\)/g;
                let imgMatch;
                while ((imgMatch = imgRegex.exec(body)) !== null) {
                    images.push(imgMatch[1]);
                }

                const videos = [];
                const vidRegex = /<video[^>]*src="([^"]*)"[^>]*>/g;
                let vidMatch;
                while ((vidMatch = vidRegex.exec(body)) !== null) {
                    videos.push(vidMatch[1]);
                }

                let textBody = body;
                textBody = textBody.replace(/!\[.*?\]\(.*?\)/g, '');
                textBody = textBody.replace(/<video[^>]*>.*?<\/video>/g, '');
                textBody = textBody.replace(/\n{3,}/g, '\n\n').trim();

                const imagesHtml = renderImages(images);
                const videosHtml = renderVideos(videos);

                const tagsArray = tags.split(',').map(t => t.trim()).filter(t => t);
                const tagsHtml = tagsArray.length > 0 ?
                    `<div class="detail-tags">${tagsArray.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` :
                    '';

                sub.textContent = date;

                container.innerHTML = `
                    <div class="detail-header">
                        <div class="avatar">
                            <img src="${AVATAR_URL}" alt="头像" loading="lazy">
                        </div>
                        <div class="info">
                            <div class="name">${NICKNAME}</div>
                            <div class="time">${date}</div>
                        </div>
                    </div>
                    <div class="detail-title">${title}</div>
                    ${textBody ? `<div class="detail-body">${textBody}</div>` : ''}
                    ${imagesHtml}
                    ${videosHtml}
                    ${tagsHtml}
                `;

            } catch (err) {
                container.innerHTML = `
                    <div class="error-state">
                        <div class="icon">❌</div>
                        <div>${err.message}</div>
                    </div>
                `;
                sub.textContent = '加载失败';
                console.error('加载文章失败:', err);
            }
        }

        function openImgModal(src) {
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            const modal = document.getElementById('imgModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImgModal();
            }
        });

        loadPost();
    </script>

</body>
</html>
