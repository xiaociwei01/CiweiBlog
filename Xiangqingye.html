<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>文章详情</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --text: #1a1a2e;
            --text-muted: #555;
            --text-faint: #bbb;
            --bg-body: #f5f6fa;
            --bg-card: #ffffff;
            --border: #f0f0f0;
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-base: 0.25s ease;
            --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --grid-gap: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text);
            padding: 20px 16px 60px;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 0.5s ease 0.05s forwards;
        }

        .nav-bar .nav-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .nav-bar .nav-title .sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-faint);
            display: block;
            margin-top: 2px;
        }

        .detail-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px 20px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            opacity: 0;
            animation: fadeInUp 0.4s ease 0.15s forwards;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .detail-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #e0e5ed;
        }

        .detail-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .detail-header .info { flex: 1; min-width: 0; }
        .detail-header .info .name { font-size: 15px; font-weight: 600; color: var(--text); }
        .detail-header .info .time { font-size: 12px; color: var(--text-faint); margin-top: 1px; }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .detail-body {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 14px;
            user-select: text;
        }

        .detail-body:empty { display: none; }

        /* 图片九宫格 */
        .detail-images {
            display: grid;
            gap: var(--grid-gap);
            margin-top: 6px;
        }

        .detail-images.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .detail-images.single img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
            background: #f0f2f5;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform var(--transition-base);
        }

        .detail-images.single img:hover { transform: scale(1.01); }

        .detail-images.multi {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
        }

        .detail-images.multi.two {
            grid-template-columns: repeat(2, 1fr);
        }

        .detail-images.multi img {
            aspect-ratio: 1 / 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #f0f2f5;
            cursor: pointer;
            border-radius: 4px;
            transition: transform var(--transition-base);
        }

        .detail-images.multi img:hover { transform: scale(1.03); }

        /* 视频 */
        .detail-videos {
            display: grid;
            gap: var(--grid-gap);
            margin-top: 6px;
        }

        .detail-videos.single {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .detail-videos.single video {
            width: 100%;
            max-height: 500px;
            display: block;
            outline: none;
            border-radius: var(--radius-sm);
            background: #000;
        }

        .detail-videos.multi {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
        }

        .detail-videos.multi video {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #000;
            outline: none;
            border-radius: 4px;
        }

        .detail-tags {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .detail-tags .tag {
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #888;
        }

        /* 加载/错误状态 */
        .loading-state, .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }

        .loading-state .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #eee;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state .icon { font-size: 48px; margin-bottom: 12px; }
        .error-state { color: #d14a4a; }

        /* 图片预览模态框 */
        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .img-modal.active { display: flex; }

        .img-modal img {
            max-width: 95%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            animation: scaleIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
            animation: fadeIn 0.5s ease 0.3s both;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (max-width: 480px) {
            .detail-container { padding: 16px 14px 18px; }
            .detail-header .avatar { width: 38px; height: 38px; }
            .detail-title { font-size: 19px; }
            .detail-body { font-size: 15px; }
            .detail-images.single img { max-height: 280px; }
            .detail-videos.single video { max-height: 280px; }
            .detail-images.multi { gap: 3px; }
            .detail-videos.multi { gap: 3px; }
            .nav-bar .nav-title { font-size: 16px; }
        }

        @media (min-width: 641px) {
            .detail-images.single img { max-height: 500px; }
            .detail-videos.single video { max-height: 500px; }
            .detail-images.multi { gap: 5px; }
            .detail-videos.multi { gap: 5px; }
        }

        @media (min-width: 768px) {
            body { padding: 24px 32px 60px; max-width: 820px; }
        }

        @media (min-width: 1024px) {
            body { max-width: 900px; padding: 32px 40px 60px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-title">
            📄 文章详情
            <span class="sub" id="detailSub">加载中...</span>
        </div>
    </nav>

    <div id="detailContent" class="detail-container">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图">
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        const BLOG_REPO = 'xiaociwei01/CiweiBlog';
        const AVATAR_URL = 'https://xiaociwei01.github.io/CiweiHome/ciweitouxiang.jpg';
        const NICKNAME = '小刺猬';

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // 构建 raw / CDN 链接（处理中文等特殊字符）
        function buildRawUrl(path) {
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path;
            }
            const clean = path.replace(/^\.?\//, '');
            return `https://raw.githubusercontent.com/${BLOG_REPO}/main/${clean}`;
        }

        // 渲染图片
        function renderImages(images) {
            if (!images || images.length === 0) return '';
            const rawImages = images.map(img => buildRawUrl(img));

            if (images.length === 1) {
                return `
                    <div class="detail-images single">
                        <img src="${rawImages[0]}" alt="图片" onclick="openImgModal(event, this.src)" loading="lazy">
                    </div>
                `;
            }

            const twoClass = images.length === 2 ? 'two' : '';
            const imgsHtml = rawImages.map(src =>
                `<img src="${src}" alt="图片" onclick="openImgModal(event, this.src)" loading="lazy">`
            ).join('');

            return `
                <div class="detail-images multi ${twoClass}">
                    ${imgsHtml}
                </div>
            `;
        }

        // 渲染视频
        function renderVideos(videos) {
            if (!videos || videos.length === 0) return '';
            const rawVideos = videos.map(v => buildRawUrl(v));

            if (videos.length === 1) {
                return `
                    <div class="detail-videos single">
                        <video controls src="${rawVideos[0]}" preload="metadata"></video>
                    </div>
                `;
            }

            const vidsHtml = rawVideos.map(src =>
                `<video controls src="${src}" preload="metadata"></video>`
            ).join('');

            return `
                <div class="detail-videos multi">
                    ${vidsHtml}
                </div>
            `;
        }

        async function loadPost() {
            const container = document.getElementById('detailContent');
            const sub = document.getElementById('detailSub');

            const filename = getUrlParam('file');
            if (!filename) {
                container.innerHTML = `
                    <div class="error-state">
                        <div class="icon">⚠️</div>
                        <div>没有指定文章</div>
                    </div>
                `;
                sub.textContent = '加载失败';
                return;
            }

            try {
                // 使用 jsDelivr CDN 加速（国内稳定），失败后回退 raw
                const encodedFilename = encodeURIComponent(filename);
                const cdnUrl = `https://cdn.jsdelivr.net/gh/${BLOG_REPO}@main/posts/${encodedFilename}`;
                const rawUrl = `https://raw.githubusercontent.com/${BLOG_REPO}/main/posts/${encodedFilename}`;

                let contentText = '';
                let res = await fetch(cdnUrl);
                if (!res.ok) {
                    // 回退 raw
                    res = await fetch(rawUrl);
                }
                if (!res.ok) {
                    throw new Error('文章不存在或无法读取');
                }
                contentText = await res.text();

                const lines = contentText.split('\n');
                let title = filename.replace('.md', '');
                let date = '未知日期';
                let tags = '';
                let bodyStart = 0;

                if (lines[0] === '---') {
                    let end = lines.indexOf('---', 1);
                    if (end !== -1) {
                        const front = lines.slice(1, end);
                        front.forEach(line => {
                            if (line.startsWith('title:')) title = line.replace('title:', '').trim();
                            if (line.startsWith('date:')) date = line.replace('date:', '').trim();
                            if (line.startsWith('tags:')) tags = line.replace('tags:', '').trim();
                        });
                        bodyStart = end + 1;
                    }
                }

                const body = lines.slice(bodyStart).join('\n').trim();

                const images = [];
                const imgRegex = /!\[.*?\]\((.*?)\)/g;
                let imgMatch;
                while ((imgMatch = imgRegex.exec(body)) !== null) {
                    images.push(imgMatch[1]);
                }

                const videos = [];
                const vidRegex = /<video[^>]*src="([^"]*)"[^>]*>/g;
                let vidMatch;
                while ((vidMatch = vidRegex.exec(body)) !== null) {
                    videos.push(vidMatch[1]);
                }

                let textBody = body;
                textBody = textBody.replace(/!\[.*?\]\(.*?\)/g, '');
                textBody = textBody.replace(/<video[^>]*>.*?<\/video>/g, '');
                textBody = textBody.replace(/\n{3,}/g, '\n\n').trim();

                const imagesHtml = renderImages(images);
                const videosHtml = renderVideos(videos);

                const tagsArray = tags.split(',').map(t => t.trim()).filter(t => t);
                const tagsHtml = tagsArray.length > 0 ?
                    `<div class="detail-tags">${tagsArray.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` :
                    '';

                sub.textContent = date;

                container.innerHTML = `
                    <div class="detail-header">
                        <div class="avatar">
                            <img src="${AVATAR_URL}" alt="头像" loading="lazy">
                        </div>
                        <div class="info">
                            <div class="name">${NICKNAME}</div>
                            <div class="time">${date}</div>
                        </div>
                    </div>
                    <div class="detail-title">${title}</div>
                    ${textBody ? `<div class="detail-body">${textBody}</div>` : ''}
                    ${imagesHtml}
                    ${videosHtml}
                    ${tagsHtml}
                `;

            } catch (err) {
                container.innerHTML = `
                    <div class="error-state">
                        <div class="icon">❌</div>
                        <div>${err.message}</div>
                    </div>
                `;
                sub.textContent = '加载失败';
                console.error('加载文章失败:', err);
            }
        }

        function openImgModal(event, src) {
            event.stopPropagation();
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            const modal = document.getElementById('imgModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImgModal();
        });

        loadPost();
    </script>

</body>
</html>
