<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>文章详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            color: #1a1a2e;
            padding: 20px 16px 60px;
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .nav-bar .nav-title { font-size: 18px; font-weight: 700; color: #1a1a2e; }
        .nav-bar .nav-title .sub {
            font-size: 12px;
            font-weight: 400;
            color: #aaa;
            display: block;
            margin-top: 2px;
        }
        .detail-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid #f0f0f0;
            margin-bottom: 16px;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .detail-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: #e0e5ed;
            flex-shrink: 0;
        }
        .detail-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-header .info { flex: 1; min-width: 0; }
        .detail-header .info .name { font-size: 15px; font-weight: 600; color: #1a1a2e; }
        .detail-header .info .time { font-size: 12px; color: #bbb; margin-top: 1px; }
        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #1a1a2e;
        }
        .detail-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .badge-pin {
            background: #fef3c7;
            color: #d97706;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .badge-modified {
            background: #dbeafe;
            color: #2563eb;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .detail-body {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 14px;
        }
        .detail-body:empty { display: none; }
        .detail-images {
            display: grid;
            gap: 4px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 6px;
        }
        .detail-images.single { grid-template-columns: 1fr; gap: 0; }
        .detail-images.single img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
            background: #f0f2f5;
            border-radius: 8px;
            cursor: pointer;
        }
        .detail-images.multi { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
        .detail-images.multi.two { grid-template-columns: repeat(2, 1fr); }
        .detail-images.multi img {
            width: 100%;
            height: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            background: #f0f2f5;
            cursor: pointer;
            border-radius: 4px;
        }
        .detail-videos {
            display: grid;
            gap: 4px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 6px;
            background: #000;
        }
        .detail-videos.single { grid-template-columns: 1fr; gap: 0; }
        .detail-videos.single video {
            width: 100%;
            max-height: 500px;
            display: block;
            border-radius: 8px;
            background: #000;
        }
        .detail-videos.multi { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
        .detail-videos.multi video {
            width: 100%;
            height: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            background: #000;
            border-radius: 4px;
        }
        .detail-tags {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .detail-tags .tag {
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #888;
        }
        .loading-state, .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #eee;
            border-top: 3px solid #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { color: #d14a4a; }
        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
        }
        .img-modal.active { display: flex; }
        .img-modal img {
            max-width: 95%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 6px;
        }
        .img-modal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 13px;
        }

        /* ===== 评论区 ===== */
        .comment-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid #f0f0f0;
        }
        .comment-section .comment-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #1a1a2e;
        }

        /* ===== Cusdis 布局优化 ===== */
        #cusdis_thread {
            min-height: 100px;
        }
        #cusdis_thread .cusdis-thread {
            display: flex;
            flex-direction: column;
        }
        #cusdis_thread .cusdis-comments {
            order: 1;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px dashed #e5e7eb;
        }
        #cusdis_thread .cusdis-input {
            order: 2;
            background: #fafbfc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #e8ecf0;
        }
        #cusdis_thread input[type="text"],
        #cusdis_thread input[type="email"],
        #cusdis_thread input[type="url"],
        #cusdis_thread textarea {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        #cusdis_thread input:focus,
        #cusdis_thread textarea:focus {
            border-color: #1a1a2e;
        }
        #cusdis_thread button[type="submit"] {
            background: #1a1a2e;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #cusdis_thread button[type="submit"]:hover {
            background: #2d2d4a;
        }

        @media (max-width: 480px) {
            .detail-container { padding: 16px 14px; }
            .detail-title { font-size: 19px; }
            .detail-body { font-size: 15px; }
            .detail-images.single img { max-height: 280px; }
            .detail-videos.single video { max-height: 280px; }
            .comment-section { padding: 16px 14px; }
            #cusdis_thread .cusdis-input { padding: 12px; }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-title">
            📄 文章详情
            <span class="sub" id="detailSub">加载中...</span>
        </div>
    </nav>

    <div id="detailContent" class="detail-container">
        <div class="loading-state">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <!-- 评论区 -->
    <div class="comment-section" id="commentSection" style="display:none;">
        <div class="comment-title">💬 评论</div>
        <div id="cusdis_thread"></div>
    </div>

    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="查看大图">
        <div class="close-hint">点击任意处关闭</div>
    </div>

    <script>
        const BLOG_REPO = 'xiaociwei01/CiweiBlog';
        const AVATAR_URL = 'https://xiaociwei01.github.io/CiweiHome/ciweitouxiang.jpg';
        const NICKNAME = '小刺猬';
        // ⚠️ 替换成你在 Cusdis 后台拿到的 app-id
        const CUSDIS_APP_ID = 'ac50fafc-701b-4b4e-82c9-7e76f0f882c2';
        const NICKNAME_KEY = 'cusdis_nickname';

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function buildMediaUrl(url) {
            if (!url) return '';
            if (url.includes('cdn.jsdelivr.net')) return url;
            if (url.includes('raw.githubusercontent.com/' + BLOG_REPO + '/main/')) {
                const path = url.split('raw.githubusercontent.com/' + BLOG_REPO + '/main/')[1];
                return `https://cdn.jsdelivr.net/gh/${BLOG_REPO}@main/${path}`;
            }
            if (url.includes('github.com/' + BLOG_REPO + '/blob/main/')) {
                const path = url.split('github.com/' + BLOG_REPO + '/blob/main/')[1];
                return `https://cdn.jsdelivr.net/gh/${BLOG_REPO}@main/${path}`;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                const clean = url.replace(/^\.?\//, '');
                return `https://cdn.jsdelivr.net/gh/${BLOG_REPO}@main/${clean}`;
            }
            return url;
        }

        function renderImages(images) {
            if (!images || images.length === 0) return '';
            if (images.length === 1) {
                return `<div class="detail-images single"><img src="${images[0]}" alt="图片" onclick="openImgModal(event, this.src)" loading="lazy"></div>`;
            }
            const twoClass = images.length === 2 ? 'two' : '';
            const imgsHtml = images.map(src => `<img src="${src}" alt="图片" onclick="openImgModal(event, this.src)" loading="lazy">`).join('');
            return `<div class="detail-images multi ${twoClass}">${imgsHtml}</div>`;
        }

        function renderVideos(videos) {
            if (!videos || videos.length === 0) return '';
            if (videos.length === 1) {
                return `<div class="detail-videos single"><video controls src="${videos[0]}" preload="metadata" playsinline></video></div>`;
            }
            const vidsHtml = videos.map(src => `<video controls src="${src}" preload="metadata" playsinline></video>`).join('');
            return `<div class="detail-videos multi">${vidsHtml}</div>`;
        }

        async function loadPost() {
            const container = document.getElementById('detailContent');
            const sub = document.getElementById('detailSub');

            const filename = getUrlParam('file');
            if (!filename) {
                container.innerHTML = `<div class="error-state"><div class="icon">⚠️</div><div>没有指定文章</div></div>`;
                sub.textContent = '加载失败';
                return;
            }

            try {
                let contentText = '';

                const apiUrl = `https://api.github.com/repos/${BLOG_REPO}/contents/posts/${encodeURIComponent(filename)}`;
                let res = await fetch(apiUrl);
                if (res.ok) {
                    const data = await res.json();
                    contentText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
                } else {
                    const rawUrl = `https://raw.githubusercontent.com/${BLOG_REPO}/main/posts/${encodeURIComponent(filename)}`;
                    res = await fetch(rawUrl);
                    if (res.ok) {
                        contentText = await res.text();
                    } else {
                        throw new Error(`无法读取文章 (状态码 ${res.status})`);
                    }
                }

                // 解析 frontmatter
                const lines = contentText.split('\n');
                let title = filename.replace('.md', '');
                let date = '未知日期';
                let tags = '';
                let pinned = false;
                let modified = '';
                let bodyStart = 0;

                if (lines[0] === '---') {
                    let end = lines.indexOf('---', 1);
                    if (end !== -1) {
                        const front = lines.slice(1, end);
                        front.forEach(line => {
                            if (line.startsWith('title:')) title = line.replace('title:', '').trim();
                            if (line.startsWith('date:')) date = line.replace('date:', '').trim();
                            if (line.startsWith('tags:')) tags = line.replace('tags:', '').trim();
                            if (line.startsWith('pinned:')) pinned = line.replace('pinned:', '').trim() === 'true';
                            if (line.startsWith('modified:')) modified = line.replace('modified:', '').trim();
                        });
                        bodyStart = end + 1;
                    }
                }

                const body = lines.slice(bodyStart).join('\n').trim();

                const images = [];
                const imgRegex = /!\[.*?\]\((.*?)\)/g;
                let imgMatch;
                while ((imgMatch = imgRegex.exec(body)) !== null) images.push(buildMediaUrl(imgMatch[1]));

                const videos = [];
                const vidRegex = /<video[^>]*src="([^"]*)"[^>]*>/g;
                let vidMatch;
                while ((vidMatch = vidRegex.exec(body)) !== null) videos.push(buildMediaUrl(vidMatch[1]));

                let textBody = body;
                textBody = textBody.replace(/!\[.*?\]\(.*?\)/g, '');
                textBody = textBody.replace(/<video[^>]*>.*?<\/video>/g, '');
                textBody = textBody.replace(/\n{3,}/g, '\n\n').trim();

                const imagesHtml = renderImages(images);
                const videosHtml = renderVideos(videos);
                const tagsArray = tags.split(',').map(t => t.trim()).filter(t => t);
                const tagsHtml = tagsArray.length > 0 ?
                    `<div class="detail-tags">${tagsArray.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : '';

                // 徽章
                const badgesHtml = `
                    <div class="detail-badges">
                        ${pinned ? '<span class="badge-pin">📌 置顶</span>' : ''}
                        ${modified ? '<span class="badge-modified">✏️ 已修改</span>' : ''}
                    </div>
                `;

                sub.textContent = date;

                container.innerHTML = `
                    <div class="detail-header">
                        <div class="avatar"><img src="${AVATAR_URL}" alt="头像" loading="lazy"></div>
                        <div class="info">
                            <div class="name">${NICKNAME}</div>
                            <div class="time">${date}</div>
                        </div>
                    </div>
                    <div class="detail-title">${title}</div>
                    ${badgesHtml}
                    ${textBody ? `<div class="detail-body">${textBody}</div>` : ''}
                    ${imagesHtml}
                    ${videosHtml}
                    ${tagsHtml}
                `;

                // 显示评论区
                document.getElementById('commentSection').style.display = 'block';

                // 初始化评论
                initComments(filename, title);

            } catch (err) {
                container.innerHTML = `
                    <div class="error-state">
                        <div class="icon">❌</div>
                        <div>${err.message}</div>
                    </div>
                `;
                sub.textContent = '加载失败';
                console.error('加载文章失败:', err);
            }
        }

        // ========== 评论功能 (Cusdis) ==========
        function initComments(filename, title) {
            const thread = document.getElementById('cusdis_thread');

            // 设置 Cusdis 配置
            thread.setAttribute('data-host', 'https://cusdis.com');
            thread.setAttribute('data-app-id', CUSDIS_APP_ID);
            thread.setAttribute('data-page-id', filename);
            thread.setAttribute('data-page-url', `${window.location.origin}${window.location.pathname}?file=${encodeURIComponent(filename)}`);
            thread.setAttribute('data-page-title', title);
            thread.setAttribute('data-theme', 'light');
            thread.setAttribute('data-lang', 'zh-cn');

            // 加载 Cusdis 脚本
            const script = document.createElement('script');
            script.src = 'https://cusdis.com/js/cusdis.es.js';
            script.async = true;
            script.defer = true;
            document.body.appendChild(script);

            // 监听渲染完成，调整布局和昵称记忆
            const observer = new MutationObserver(() => {
                adjustCusdisLayout();
                setupNicknameMemory();
            });
            observer.observe(thread, { childList: true, subtree: true });

            setTimeout(() => {
                adjustCusdisLayout();
                setupNicknameMemory();
            }, 2000);
        }

        // ========== 调整布局：评论在上，输入框在下 ==========
        function adjustCusdisLayout() {
            const thread = document.getElementById('cusdis_thread');

            const commentList = thread.querySelector('.cusdis-comments') ||
                                thread.querySelector('[class*="comment-list"]') ||
                                thread.querySelector('[class*="comments"]');

            const inputArea = thread.querySelector('.cusdis-input') ||
                              thread.querySelector('[class*="input-area"]') ||
                              thread.querySelector('form') ||
                              thread.querySelector('[class*="form"]');

            if (commentList && inputArea) {
                if (!(commentList.compareDocumentPosition(inputArea) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                    inputArea.parentNode.insertBefore(commentList, inputArea);
                }
            }
        }

        // ========== 记住昵称 ==========
        function setupNicknameMemory() {
            const thread = document.getElementById('cusdis_thread');

            const nicknameInput = thread.querySelector('input[name="nickname"]') ||
                                  thread.querySelector('input[placeholder*="昵称"]') ||
                                  thread.querySelector('input[placeholder*="名字"]') ||
                                  thread.querySelector('input[placeholder*="name"]') ||
                                  thread.querySelector('input[type="text"]');

            if (!nicknameInput) return;

            const savedNickname = localStorage.getItem(NICKNAME_KEY);
            if (savedNickname) {
                nicknameInput.value = savedNickname;
                nicknameInput.dispatchEvent(new Event('input', { bubbles: true }));
                nicknameInput.dispatchEvent(new Event('change', { bubbles: true }));
            }

            if (!nicknameInput.dataset.nicknameMemorySetup) {
                nicknameInput.addEventListener('input', function() {
                    const value = this.value.trim();
                    if (value) {
                        localStorage.setItem(NICKNAME_KEY, value);
                    }
                });
                nicknameInput.dataset.nicknameMemorySetup = 'true';
            }
        }

        function openImgModal(event, src) {
            event.stopPropagation();
            const modal = document.getElementById('imgModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImgModal() {
            document.getElementById('imgModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImgModal();
        });

        loadPost();
    </script>
</body>
</html>
